name: Deploy

# Plan 2.3: deployment is gated on CI passing and on an explicit environment,
# so a production release always requires the configured approvers/secrets.
#
# Required repository configuration:
#   Secrets  — RAILWAY_TOKEN
#   Variables — RAILWAY_SERVICE (service name or id), HEALTHCHECK_URL
#
# Migrations are NOT run from here: scripts/migrate-and-start.sh applies them in
# the container at boot, so a rollback of the image also rolls back the deploy
# path in one place.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Require a green CI run for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100,
            });
            const failed = data.check_runs.filter(
              (run) => run.conclusion && !["success", "neutral", "skipped"].includes(run.conclusion)
            );
            if (failed.length > 0) {
              core.setFailed(`Refusing to deploy: ${failed.map((r) => r.name).join(", ")} did not pass.`);
            }

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not configured for this environment."
            exit 1
          fi
          npm i -g @railway/cli
          railway up --service "${{ vars.RAILWAY_SERVICE }}" --detach

      - name: Wait for the deployment to become healthy
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::warning::HEALTHCHECK_URL is not set — skipping post-deploy verification."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTHCHECK_URL" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status} — retrying in 10s"
            sleep 10
          done
          echo "::error::Deployment did not become healthy within 5 minutes."
          cat /tmp/health.json || true
          exit 1
