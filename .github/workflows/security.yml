name: Security

# Plan 3.4: dependency vulnerability scanning plus static analysis.
# Uses first-party GitHub tooling (CodeQL) and npm's built-in auditor so no
# third-party account or token is required to get value on day one.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

      - name: Full advisory report (informational)
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 14
          if-no-files-found: ignore

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-and-quality adds maintainability rules on top of the
          # default security queries.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Dockerfile builds the app, so only scan it when it or its inputs change.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t prince-invoice-generator:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: prince-invoice-generator:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
        continue-on-error: true
