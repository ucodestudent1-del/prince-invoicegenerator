name: Secrets scan

# Plan 1.1: fail the pipeline if a credential pattern appears in the repository.
# Runs on every push and pull request, plus a weekly sweep of the full tree in
# case a pattern is added to the scanner after a commit has already landed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scanner can diff against the base branch and so
          # the history sweep below can inspect every commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci`: the scanner is dependency-free by design so it can run
      # before any third-party code is installed.
      - name: Scan tracked files
        run: node scripts/secrets-check.mjs

      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          node scripts/secrets-check.mjs --diff origin/${{ github.base_ref }}

      - name: Assert .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git. Remove it, rotate every credential it contained, and purge it from history."
            exit 1
          fi
          echo ".env is not tracked."

      - name: Assert .env was never committed
        run: |
          if git log --all --pretty=format: --name-only --diff-filter=A | sort -u | grep -qx ".env"; then
            echo "::error::.env appears in git history. Rotate every credential and rewrite history (git filter-repo)."
            exit 1
          fi
          echo ".env does not appear in git history."
